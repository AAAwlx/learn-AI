    <text x="105" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5C351A">s13</text>
    <text x="147" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5C351A">...</text>
