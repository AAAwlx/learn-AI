  <path d="M716 474H898" stroke="#B45A22" stroke-width="2" stroke-linecap="round"/>
  <path d="M898 474L886 467V481L898 474Z" fill="#B45A22"/>
  <text x="807" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#B45A22">
