  </text>

  <text x="140" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2E5EAA">Q</text>
  <text x="140" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4D5966">n 个查询 token</text>

  <text x="458" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2E5EAA">K^T</text>
  <text x="458" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4D5966">n 个键 token</text>

  <text x="732" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B45A22">QK^T</text>
  <text x="732" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4D5966">每个 token 对所有 token 的分数</text>

