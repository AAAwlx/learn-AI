<svg width="1240" height="700" viewBox="0 0 1240 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1240" height="700" fill="#F7F8FA"/>
  <text x="620" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#20242A">线性注意力：从 N x N 两两计算到线性聚合</text>

  <!-- Block 1 -->
  <rect x="36" y="82" width="362" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="217" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#B45309">1. 未优化注意力计算</text>
  <text x="217" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">先构造完整注意力矩阵</text>

  <g transform="translate(82 184)">
    <rect x="0" y="0" width="96" height="58" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <text x="48" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">Q</text>
    <text x="48" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1E3A8A">N x d</text>
  </g>
  <text x="202" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0F172A">x</text>
  <g transform="translate(230 184)">
    <rect x="0" y="0" width="96" height="58" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <text x="48" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1E3A8A">K^T</text>
    <text x="48" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1E3A8A">d x N</text>
  </g>

  <path d="M217 260V290" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M217 290L209 278H225L217 290Z" fill="#94A3B8"/>
  <g transform="translate(112 302)">
    <rect x="0" y="0" width="210" height="88" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <line x1="0" y1="22" x2="210" y2="22" stroke="#F59E0B"/>
    <line x1="0" y1="44" x2="210" y2="44" stroke="#F59E0B"/>
    <line x1="0" y1="66" x2="210" y2="66" stroke="#F59E0B"/>
    <line x1="42" y1="0" x2="42" y2="88" stroke="#F59E0B"/>
    <line x1="84" y1="0" x2="84" y2="88" stroke="#F59E0B"/>
    <line x1="126" y1="0" x2="126" y2="88" stroke="#F59E0B"/>
    <line x1="168" y1="0" x2="168" y2="88" stroke="#F59E0B"/>
    <text x="105" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E">QK^T: N x N</text>
  </g>

  <path d="M217 430V460" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M217 460L209 448H225L217 460Z" fill="#94A3B8"/>
  <text x="217" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#B45309">softmax(QK^T)V</text>
  <text x="217" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#B45309">每个 Query 都要对所有 Key 计算</text>
  <text x="217" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#B45309">N 个 Query x N 个 Key</text>
  <text x="217" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#B45309">复杂度：O(N^2)</text>

  <!-- Block 2 -->
  <rect x="439" y="82" width="362" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="620" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#047857">2. 线性注意力推导过程</text>
  <text x="620" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">把相似度拆成 Query 部分和 Key 部分</text>

  <g transform="translate(478 188)">
    <rect x="0" y="0" width="124" height="58" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <text x="62" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A">q_i</text>
    <text x="62" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Query</text>
  </g>
  <g transform="translate(478 278)">
    <rect x="0" y="0" width="124" height="58" rx="7" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <text x="62" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1E3A8A">k_j</text>
    <text x="62" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Key</text>
  </g>
  <path d="M612 217C644 222 658 238 680 252" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M680 252L666 247L673 262L680 252Z" fill="#94A3B8"/>
  <path d="M612 307C644 302 658 286 680 272" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M680 272L673 262L666 277L680 272Z" fill="#94A3B8"/>
  <g transform="translate(690 210)">
    <rect x="0" y="0" width="76" height="104" rx="7" fill="#DCFCE7" stroke="#34D399" stroke-width="2"/>
    <text x="38" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#047857">φ(q_i)</text>
    <text x="38" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">与</text>
    <text x="38" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#047857">φ(k_j)</text>
  </g>

  <text x="620" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#047857">sim(q_i,k_j) ≈ φ(q_i)^T φ(k_j)</text>
  <text x="620" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">代入注意力分子：</text>
  <text x="620" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#047857">sum_j φ(q_i)^T φ(k_j) v_j</text>
  <text x="620" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">因为 φ(q_i) 与 j 无关，可以提出：</text>
  <text x="620" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">φ(q_i)^T [sum_j φ(k_j)v_j^T]</text>
  <text x="620" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#047857">关键：先把所有 K/V 聚合，再让 Q 读取</text>

  <!-- Block 3 -->
  <rect x="842" y="82" width="362" height="560" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1023" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#047857">3. 优化后的计算顺序</text>
  <text x="1023" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">不再生成 N x N 矩阵</text>

  <text x="1023" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E">先逐 token 配对相乘并累加</text>
  <text x="1023" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#0F766E">S = sum_j [φ(k_j)v_j^T]</text>
  <text x="1023" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0F766E">= φ(k1)v1^T + φ(k2)v2^T + ... + φ(kN)vN^T</text>

  <g transform="translate(884 270)">
    <rect x="0" y="0" width="94" height="158" rx="7" fill="#DCFCE7" stroke="#34D399" stroke-width="2"/>
    <line x1="0" y1="39.5" x2="94" y2="39.5" stroke="#34D399"/>
    <line x1="0" y1="79" x2="94" y2="79" stroke="#34D399"/>
    <line x1="0" y1="118.5" x2="94" y2="118.5" stroke="#34D399"/>
    <text x="47" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#065F46">φ(k1)</text>
    <text x="47" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#065F46">φ(k2)</text>
    <text x="47" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#065F46">...</text>
    <text x="47" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#065F46">φ(kN)</text>
  </g>
  <g transform="translate(1020 270)">
    <rect x="0" y="0" width="72" height="158" rx="7" fill="#E0F2FE" stroke="#38BDF8" stroke-width="2"/>
    <line x1="0" y1="39.5" x2="72" y2="39.5" stroke="#38BDF8"/>
    <line x1="0" y1="79" x2="72" y2="79" stroke="#38BDF8"/>
    <line x1="0" y1="118.5" x2="72" y2="118.5" stroke="#38BDF8"/>
    <text x="36" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">v1</text>
    <text x="36" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">v2</text>
    <text x="36" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">...</text>
    <text x="36" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">vN</text>
  </g>
  <path d="M982 292H1016" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M982 332H1016" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M982 410H1016" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <text x="1000" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#047857">同位置两两相乘后求和</text>

  <path d="M1114 348H1148" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M1148 348L1136 340V356L1148 348Z" fill="#94A3B8"/>
  <g transform="translate(1156 302)">
    <rect x="0" y="0" width="38" height="92" rx="7" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2"/>
    <text x="19" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E">S</text>
    <text x="19" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0F766E">rxd</text>
  </g>

  <text x="1023" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">再对每个 Query：</text>
  <text x="1023" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#047857">o_i = φ(q_i)^T S / φ(q_i)^T z</text>
  <text x="1023" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#047857">复杂度：O(N)</text>
  <text x="1023" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">严格说还会乘特征维度 r 和 value 维度 d</text>
</svg>
