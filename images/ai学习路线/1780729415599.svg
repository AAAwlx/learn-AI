    <text x="640" y="466" text-anchor="middle" class="node-sub">Prompts · Tools · Permissions · Compaction · Sub-agents</text>
  </g>

  <rect x="44" y="526" width="558" height="236" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="7 5"/>
