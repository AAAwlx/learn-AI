    <path d="M 388 704 L 458 704 L 488 734 L 488 746 L 388 746 Z" fill="#dcfce7" stroke="#059669" stroke-width="1.8"/>
    <path d="M 458 704 L 458 734 L 488 734" fill="none" stroke="#059669" stroke-width="1.8"/>
