  <path d="M 197 658 L 197 682" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 302 622 L 362 622" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 302 646 L 332 646 L 332 724 L 362 724" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <path d="M 1021 468 L 1021 502 L 799 502 L 799 586" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 1021 502 L 979 502 L 979 586" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 1021 502 L 1147 502 L 1147 586" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 799 644 L 799 682" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
