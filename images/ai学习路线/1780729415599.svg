<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 30px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .layer-title { font-size: 14px; font-weight: 700; fill: #2563eb; letter-spacing: 1px; }
    .node-title { font-size: 18px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 12px; fill: #6b7280; }
    .small { font-size: 11px; fill: #6b7280; }
    .legend { font-size: 12px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="640" y="48" text-anchor="middle" class="title">Agent 核心运行架构</text>
  <text x="640" y="76" text-anchor="middle" class="subtitle">LLM + Memory + Tools + Loop = Agent</text>

  <rect x="44" y="104" width="1192" height="126" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="68" y="132" class="layer-title">INPUT LAYER 输入层</text>

  <g filter="url(#shadow)">
    <rect x="94" y="150" width="128" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="130" cy="178" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="130" cy="171" r="5" fill="#2563eb"/>
    <path d="M 117 190 C 123 182, 137 182, 143 190" stroke="#2563eb" stroke-width="2" fill="none"/>
    <text x="180" y="184" text-anchor="middle" class="node-title">User</text>

    <rect x="280" y="145" width="202" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="381" y="172" text-anchor="middle" class="small">GOAL</text>
    <text x="381" y="194" text-anchor="middle" class="node-title">Task / Query</text>

    <rect x="540" y="145" width="202" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="641" y="172" text-anchor="middle" class="small">ASYNC</text>
    <text x="641" y="194" text-anchor="middle" class="node-title">Event / Trigger</text>

    <rect x="800" y="145" width="276" height="66" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="938" y="172" text-anchor="middle" class="small">CONFIG</text>
    <text x="938" y="194" text-anchor="middle" class="node-title">System Prompt + Rules</text>
  </g>

  <rect x="44" y="270" width="1192" height="214" rx="18" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="68" y="298" class="layer-title">AGENT CORE 智能体核心</text>

  <g filter="url(#shadow)">
    <rect x="110" y="328" width="222" height="74" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="221" y="354" text-anchor="middle" class="small">REASONING</text>
    <text x="221" y="376" text-anchor="middle" class="node-title">Planner</text>
    <text x="221" y="394" text-anchor="middle" class="node-sub">Decompose / Plan</text>

    <rect x="482" y="316" width="276" height="98" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="492" y="326" width="256" height="78" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="620" y="354" text-anchor="middle" class="small">MODEL</text>
    <text x="620" y="378" text-anchor="middle" class="node-title">LLM Core</text>
    <text x="620" y="396" text-anchor="middle" class="node-sub">Reason + Decide</text>

