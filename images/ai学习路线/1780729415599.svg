    <text x="979" y="730" text-anchor="middle" class="node-sub">standard protocol</text>
    <rect x="1084" y="682" width="126" height="58" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="1147" y="718" text-anchor="middle" class="node-title">Sub-Agent</text>
  </g>

  <rect x="44" y="806" width="1192" height="70" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" stroke-dasharray="7 5"/>
