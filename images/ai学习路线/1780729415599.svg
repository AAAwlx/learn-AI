  <path d="M 370 760 L 370 828" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 656 468 L 656 828" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M 979 740 L 979 784 L 942 784 L 942 828" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <path d="M 1021 328 C 1021 280, 620 280, 620 316" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text x="814" y="278" text-anchor="middle" class="small">loop / observe</text>

  <g transform="translate(874, 882)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
