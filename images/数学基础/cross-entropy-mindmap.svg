<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" width="1280" height="980" role="img" aria-labelledby="title desc">
  <title id="title">交叉熵推导流程图</title>
  <desc id="desc">从事件概率、自信息、香农熵、近似分布编码、KL 散度分解，逐步推导出交叉熵公式，并连接到分类损失。</desc>
  <style>
    text {
      font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #4b5563; }
    .step-num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .step-title { font-size: 20px; font-weight: 700; }
    .body { font-size: 15px; fill: #374151; }
    .formula { font-size: 17px; font-weight: 600; fill: #111827; }
    .small { font-size: 13px; fill: #6b7280; }
    .box { rx: 12; ry: 12; stroke-width: 1.8; }
    .note { rx: 10; ry: 10; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #2563eb; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
    .arrow-green { fill: none; stroke: #16a34a; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
    .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
    .arrow-red { fill: none; stroke: #dc2626; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-red); }
  </style>
  <defs>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#111827" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1280" height="980" fill="#ffffff"/>
  <text x="640" y="52" text-anchor="middle" class="title">交叉熵的推导逻辑链</text>
  <text x="640" y="82" text-anchor="middle" class="subtitle">先定义“信息量”和“最优编码长度”，再比较真实分布 P 与近似分布 Q 的编码代价</text>

  <g filter="url(#shadow)">
    <rect class="box" x="70" y="132" width="320" height="134" fill="#eff6ff" stroke="#bfdbfe"/>
  </g>
  <circle cx="106" cy="168" r="17" fill="#2563eb"/>
  <text x="106" y="174" text-anchor="middle" class="step-num">1</text>
  <text x="134" y="174" class="step-title">从事件概率开始</text>
  <text x="98" y="210" class="body">事件 xᵢ 的发生概率是 pᵢ</text>
  <text x="98" y="238" class="formula">P(X = xᵢ) = pᵢ</text>

  <path class="arrow" d="M390 199 C430 199, 452 199, 492 199"/>

  <g filter="url(#shadow)">
    <rect class="box" x="492" y="132" width="320" height="134" fill="#f0fdf4" stroke="#bbf7d0"/>
  </g>
  <circle cx="528" cy="168" r="17" fill="#16a34a"/>
  <text x="528" y="174" text-anchor="middle" class="step-num">2</text>
  <text x="556" y="174" class="step-title">定义自信息</text>
  <text x="520" y="210" class="body">越小概率的事件，发生时信息量越大</text>
  <text x="520" y="238" class="formula">I(xᵢ) = -log pᵢ</text>

  <path class="arrow-green" d="M812 199 C852 199, 874 199, 914 199"/>

  <g filter="url(#shadow)">
    <rect class="box" x="914" y="132" width="320" height="134" fill="#fff7ed" stroke="#fed7aa"/>
  </g>
  <circle cx="950" cy="168" r="17" fill="#ea580c"/>
  <text x="950" y="174" text-anchor="middle" class="step-num">3</text>
  <text x="978" y="174" class="step-title">对自信息求期望</text>
  <text x="942" y="210" class="body">得到真实分布 P 的最小平均编码长度</text>
  <text x="942" y="238" class="formula">H(P) = -Σ pᵢ log pᵢ</text>

  <path class="arrow-orange" d="M1074 266 C1074 318, 1006 340, 960 365"/>

  <g filter="url(#shadow)">
    <rect class="box" x="760" y="365" width="420" height="148" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <circle cx="798" cy="402" r="17" fill="#64748b"/>
  <text x="798" y="408" text-anchor="middle" class="step-num">4</text>
  <text x="828" y="408" class="step-title">换成近似分布 Q 来编码 P</text>
  <text x="790" y="444" class="body">真实事件仍按 pᵢ 出现，但编码长度改用 -log qᵢ</text>
  <text x="790" y="474" class="formula">H(P,Q) = -Σ pᵢ log qᵢ</text>

  <path class="arrow" d="M760 439 C700 439, 666 439, 606 439"/>

  <g filter="url(#shadow)">
    <rect class="box" x="178" y="365" width="428" height="148" fill="#faf5ff" stroke="#e9d5ff"/>
  </g>
  <circle cx="216" cy="402" r="17" fill="#9333ea"/>
  <text x="216" y="408" text-anchor="middle" class="step-num">5</text>
  <text x="246" y="408" class="step-title">比较两种编码长度</text>
  <text x="208" y="444" class="body">Q 比 P 多花的平均编码长度就是 KL 散度</text>
  <text x="208" y="474" class="formula">Dₖₗ(P||Q) = H(P,Q) - H(P)</text>

  <path class="arrow" d="M392 513 C392 565, 434 590, 476 620"/>

  <g filter="url(#shadow)">
    <rect class="box" x="390" y="620" width="500" height="164" fill="#ecfeff" stroke="#99f6e4"/>
  </g>
  <circle cx="430" cy="660" r="17" fill="#0f766e"/>
  <text x="430" y="666" text-anchor="middle" class="step-num">6</text>
  <text x="460" y="666" class="step-title">由 KL 分解得到交叉熵</text>
  <text x="420" y="704" class="body">展开 KL 散度：</text>
  <text x="420" y="735" class="formula">Dₖₗ(P||Q) = Σ pᵢ log(pᵢ/qᵢ)</text>
  <text x="420" y="765" class="formula">= H(P,Q) - H(P)</text>

  <path class="arrow-green" d="M640 784 C640 816, 640 834, 640 866"/>

  <g filter="url(#shadow)">
    <rect class="box" x="390" y="866" width="500" height="82" fill="#fefce8" stroke="#fde68a"/>
  </g>
  <text x="640" y="902" text-anchor="middle" class="step-title">固定真实分布 P 时，H(P) 是常数</text>
  <text x="640" y="930" text-anchor="middle" class="formula">最小化 H(P,Q) ⇔ 最小化 Dₖₗ(P||Q)</text>

  <path class="arrow-red" d="M890 702 C970 702, 1010 702, 1084 702"/>

  <g filter="url(#shadow)">
    <rect class="box" x="940" y="600" width="270" height="184" fill="#fef2f2" stroke="#fecaca"/>
  </g>
  <text x="1075" y="634" text-anchor="middle" class="step-title">落到分类损失</text>
  <text x="972" y="670" class="body">二分类：</text>
  <text x="972" y="698" class="small">BCE = -[y log ŷ + (1-y)log(1-ŷ)]</text>
  <text x="972" y="736" class="body">多分类：</text>
  <text x="972" y="764" class="small">logits → softmax → CE</text>

  <rect class="note" x="70" y="600" width="260" height="184" fill="#ffffff" stroke="#d1d5db"/>
  <text x="200" y="636" text-anchor="middle" class="step-title">核心直觉</text>
  <text x="98" y="674" class="body">如果模型给真实类别的概率 qᵢ 越大，</text>
  <text x="98" y="704" class="body">则 -log qᵢ 越小，交叉熵越小。</text>
  <text x="98" y="744" class="body">所以训练会推动模型把概率质量</text>
  <text x="98" y="774" class="body">分配给真实标签。</text>

  <path class="arrow-red" d="M330 692 C360 692, 366 692, 390 692"/>
</svg>
